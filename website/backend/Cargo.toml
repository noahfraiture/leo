[package]
name = "video-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
axum-htmx = "0.8.1"
envy = "0.4.2"
hypertext = { git = "https://github.com/vidhanio/hypertext", features = ["alpine", "htmx"]}
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tonic = "0.14.5"
tonic-prost = "0.14.5"
tower-http = { version = "0.6.6", features = ["fs"] }
surrealdb = { version = "3.0.5", features = ["kv-mem", "kv-surrealkv"] }

[build-dependencies]
tonic-prost-build = "0.14.5"

[dev-dependencies]
tower = "0.5.3"
