# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv:
  - .local

tasks:
  setup:
    desc: Install local dependencies used by project workflows
    deps:
      - css:install

  build:
    desc: Build the backend
    deps:
      - backend:build

  run:
    desc: Build and run the local backend once
    deps:
      - css:build
    dir: backend
    cmds:
      - cargo run

  dev:
    desc: Restart the backend on source changes
    deps:
      - css:build
    cmds:
      - task --parallel css:watch backend:watch

  test:
    desc: Run backend tests
    deps:
      - backend:test

  check:
    desc: Run the local build and test verification suite
    cmds:
      - task build
      - task test

  css:install:
    method: timestamp
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile

  css:build:
    deps:
      - css:install
    cmds:
      - pnpm run build:css

  css:watch:
    deps:
      - css:install
    cmds:
      - pnpm run watch:css

  backend:build:
    dir: backend
    deps:
      - css:build
    cmds:
      - cargo build

  backend:run:
    cmds:
      - task run

  backend:analyze:
    desc: Analyze local videos from the CLI
    dir: backend
    cmds:
      - cargo run -- analyze {{.CLI_ARGS}}

  backend:watch:
    dir: backend
    cmds:
      - >-
        cargo watch
        --why
        --watch Cargo.toml
        --watch Cargo.lock
        --watch src
        --watch ../.local
        --shell 'set -a; [ ! -f ../.local ] || . ../.local; set +a; cargo run'

  backend:test:
    dir: backend
    cmds:
      - cargo test
