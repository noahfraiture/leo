# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv:
  - .local

tasks:
  setup:
    desc: Install local dependencies used by project workflows
    deps:
      - frontend:install

  build:
    desc: Build frontend assets and the backend
    deps:
      - frontend:build
      - backend:build

  run:
    desc: Build if needed and run the local backend once
    deps:
      - frontend:build
      - backend:build
    dir: backend
    cmds:
      - ./target/debug/video-analysis

  dev:
    desc: Watch frontend assets and restart the backend on changes
    deps:
      - frontend:build
    cmds:
      - task --parallel frontend:watch backend:watch

  test:
    desc: Run backend and frontend tests
    deps:
      - backend:test
      - frontend:test

  check:
    desc: Run the local build and test verification suite
    cmds:
      - task build
      - task test

  frontend:install:
    dir: frontend
    method: timestamp
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile

  frontend:build:
    dir: frontend
    deps:
      - frontend:install
    method: timestamp
    sources:
      - package.json
      - pnpm-lock.yaml
      - src/app.css
      - ../backend/src/http/ui/**/*.rs
    generates:
      - dist/assets/main.css
    cmds:
      - pnpm run build

  frontend:watch:
    dir: frontend
    deps:
      - frontend:install
    cmds:
      - pnpm run watch

  frontend:test:
    dir: frontend
    deps:
      - frontend:install
    cmds:
      - pnpm run test

  backend:build:
    dir: backend
    method: timestamp
    sources:
      - Cargo.toml
      - Cargo.lock
      - src/**/*.rs
    generates:
      - target/debug/video-analysis
    cmds:
      - cargo build

  backend:run:
    cmds:
      - task run

  backend:watch:
    dir: backend
    cmds:
      - >-
        cargo watch
        --why
        --watch Cargo.toml
        --watch Cargo.lock
        --watch src
        --watch ../frontend/dist/assets/main.css
        --watch ../.local
        --shell 'set -a; [ ! -f ../.local ] || . ../.local; set +a; cargo run'

  backend:test:
    dir: backend
    cmds:
      - cargo test
