[package]
name = "app"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
desktop-e2e = ["backend/test-support"]
paid-openai-evaluations = []

[dependencies]
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
backend = { path = "../backend" }
dirs = "6"
dioxus = {
    version = "0.7.9",
    default-features = false,
    features = ["desktop", "lib", "launch", "router"]
}
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "process", "fs"] }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
backend = { path = "../backend", features = ["test-support"] }
dioxus-ssr = "=0.7.9"
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "playback_probe"
required-features = ["desktop-e2e"]
