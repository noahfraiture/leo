name: Publish website image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "website/**"
  workflow_dispatch:

concurrency:
  group: publish-website-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Dockerfile
        id: dockerfile
        run: |
          if [ -s website/Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::website/Dockerfile is empty; skipping image publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image name
        if: steps.dockerfile.outputs.ready == 'true'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.dockerfile.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.dockerfile.outputs.ready == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        if: steps.dockerfile.outputs.ready == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published image
        if: steps.dockerfile.outputs.ready == 'true'
        run: |
          primary_tag="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7}"

          {
            echo "## Published image"
            echo
            echo "Primary tag:"
            echo
            echo '```'
            echo "$primary_tag"
            echo '```'
            echo
            echo "All tags:"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest:"
            echo
            echo '```'
            echo "${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Digest-pinned pull:"
            echo
            echo '```sh'
            echo "docker pull ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Published image::$primary_tag"

      - name: Generate artifact attestation
        if: steps.dockerfile.outputs.ready == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
