name: Publish website image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-website-image.yml"
      - "website/**"
  workflow_dispatch:

concurrency:
  group: publish-website-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Dockerfile
        id: dockerfile
        run: |
          if [ -s website/Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::website/Dockerfile is empty; skipping image publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        if: steps.dockerfile.outputs.ready == 'true'
        id: image
        run: |
          image_name="ghcr.io/noahfraiture/leo"
          short_sha="${GITHUB_SHA::7}"

          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "prod_tag=prod-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.dockerfile.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.dockerfile.outputs.ready == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.prod_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=website-image
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: |
            type=gha,scope=website-image,mode=max
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,oci-mediatypes=true

      - name: Summarize published image
        if: steps.dockerfile.outputs.ready == 'true'
        run: |
          prod_ref="${{ steps.image.outputs.name }}:${{ steps.image.outputs.prod_tag }}"
          sha_ref="${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}"

          {
            echo "## Published image"
            echo
            echo "Flux deployment tag:"
            echo
            echo '```'
            echo "$prod_ref"
            echo '```'
            echo
            echo "Immutable source tag:"
            echo
            echo '```'
            echo "$sha_ref"
            echo '```'
            echo
            echo "Digest:"
            echo
            echo '```'
            echo "${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Digest-pinned pull:"
            echo
            echo '```sh'
            echo "docker pull ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Published image::$prod_ref"

      - name: Generate artifact attestation
        if: steps.dockerfile.outputs.ready == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
