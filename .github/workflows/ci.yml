name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Non-paid tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Unit tests
        run: nix develop --command just test-unit
      - name: End-to-end tests
        run: nix develop --command just test-e2e
