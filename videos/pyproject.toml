[project]
name = "videollm"
version = "0.1.0"
description = "Analyze videos directly with Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
]

[project.scripts]
videollm = "analyze_video:main"

[tool.setuptools]
py-modules = ["analyze_video"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
